name: Quality Check and RC Tag

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage

  rc-tag:
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next RC tag
        id: next_tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_semver_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1 || true)"

          if [[ -z "${latest_semver_tag}" ]]; then
            new_tag="v0.1.0-rc.1"
          elif [[ "${latest_semver_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            rc_iter="${BASH_REMATCH[4]}"
            next_iter="$((rc_iter + 1))"
            new_tag="v${major}.${minor}.${patch}-rc.${next_iter}"
          elif [[ "${latest_semver_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            next_minor="$((minor + 1))"
            new_tag="v${major}.${next_minor}.0-rc.1"
          else
            echo "No valid semver tags found, defaulting to v0.1.0-rc.1"
            new_tag="v0.1.0-rc.1"
          fi

          if [[ "${new_tag}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+-rc\.)([0-9]+)$ ]]; then
            prefix="${BASH_REMATCH[1]}"
            iter="${BASH_REMATCH[2]}"
            while git rev-parse -q --verify "refs/tags/${new_tag}" >/dev/null; do
              iter="$((iter + 1))"
              new_tag="${prefix}${iter}"
            done
          fi

          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "Generated RC tag: ${new_tag}"

      - name: Create and push RC tag
        env:
          NEW_TAG: ${{ steps.next_tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          git tag "${NEW_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${NEW_TAG}"
