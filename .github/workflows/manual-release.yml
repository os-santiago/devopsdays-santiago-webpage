name: Manual Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm that you want to execute release"
        required: true
        type: boolean
        default: false
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - minor
          - major
        default: minor

permissions:
  contents: write

concurrency:
  group: manual-release-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.compute.outputs.rc_tag }}
      final_tag: ${{ steps.compute.outputs.final_tag }}
      release_type: ${{ steps.compute.outputs.release_type }}
      last_stable_tag: ${{ steps.compute.outputs.last_stable_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch and confirmation
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "This workflow can only run from main. Current branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ "${{ github.event.inputs.confirm_release }}" != "true" ]]; then
            echo "Release confirmation was not provided. Set confirm_release=true."
            exit 1
          fi

      - name: Compute release version
        id: compute
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_rc_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*' | sort -V | tail -n 1 || true)"
          latest_stable_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          release_type="${{ github.event.inputs.release_type }}"

          if [[ -z "${latest_rc_tag}" ]]; then
            echo "No active RC tag found. Expected something like vX.Y.Z-rc.N"
            exit 1
          fi

          if [[ "${release_type}" == "minor" ]]; then
            if [[ "${latest_rc_tag}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
              final_tag="${BASH_REMATCH[1]}"
            else
              echo "Invalid RC tag format: ${latest_rc_tag}"
              exit 1
            fi
          elif [[ "${release_type}" == "major" ]]; then
            if [[ -n "${latest_stable_tag}" && "${latest_stable_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              next_major="$((BASH_REMATCH[1] + 1))"
              final_tag="v${next_major}.0.0"
            else
              final_tag="v1.0.0"
            fi
          else
            echo "Unsupported release type: ${release_type}"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${final_tag}" >/dev/null; then
            echo "Final tag already exists: ${final_tag}"
            exit 1
          fi

          echo "rc_tag=${latest_rc_tag}" >> "$GITHUB_OUTPUT"
          echo "final_tag=${final_tag}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "last_stable_tag=${latest_stable_tag}" >> "$GITHUB_OUTPUT"

  # quality:
  #   runs-on: ubuntu-latest
  #   needs: preflight
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Lint
  #       run: npm run lint

  #     - name: Unit tests
  #       run: npm test

  #     - name: Coverage gate
  #       run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    needs:
      - preflight
      # - quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with release version
        env:
          VITE_APP_VERSION: ${{ needs.preflight.outputs.final_tag }}
        run: npm run build --production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

  approve-and-deploy:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    environment: prod
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "${CPANEL_SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          port="${CPANEL_SSH_PORT:-22}"
          ssh-keyscan -p "${port}" -H "${CPANEL_SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to cPanel
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail

          port="${CPANEL_SSH_PORT:-21}"
          rsync -az --delete -e "ssh -p ${port}" dist/ "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}:devopsdayschile.cl/"

  smoke-test:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - approve-and-deploy
    steps:
      - name: Validate deployed version
        env:
          EXPECTED_TAG: ${{ needs.preflight.outputs.final_tag }}
        run: |
          set -euo pipefail

          expected_meta="<meta name=\"app-version\" content=\"${EXPECTED_TAG}\">"
          attempt=1
          max_attempts=12

          while [[ ${attempt} -le ${max_attempts} ]]; do
            html="$(curl -fsSL https://santiago.devopsdayschile.cl/ || true)"
            if grep -Fq "${expected_meta}" <<< "${html}"; then
              echo "Smoke test passed with expected version ${EXPECTED_TAG}"
              exit 0
            fi

            echo "Attempt ${attempt}/${max_attempts}: expected version not visible yet"
            attempt=$((attempt + 1))
            sleep 10
          done

          echo "Smoke test failed: expected deployed version ${EXPECTED_TAG}"
          exit 1

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          FINAL_TAG: ${{ needs.preflight.outputs.final_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${FINAL_TAG}" >/dev/null; then
            echo "Tag already exists: ${FINAL_TAG}"
            exit 1
          fi

          git tag -a "${FINAL_TAG}" -m "Release ${FINAL_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${FINAL_TAG}"

      - name: Generate changelog
        id: changelog
        env:
          LAST_STABLE_TAG: ${{ needs.preflight.outputs.last_stable_tag }}
        run: |
          set -euo pipefail

          if [[ -n "${LAST_STABLE_TAG}" ]]; then
            git log --pretty=format:'- %h %s' "${LAST_STABLE_TAG}..${GITHUB_SHA}" > CHANGELOG_RELEASE.md
          else
            git log --pretty=format:'- %h %s' "${GITHUB_SHA}" > CHANGELOG_RELEASE.md
          fi

          if [[ ! -s CHANGELOG_RELEASE.md ]]; then
            echo "- No commits found in selected range." > CHANGELOG_RELEASE.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_TAG: ${{ needs.preflight.outputs.final_tag }}
        run: |
          set -euo pipefail
          gh release create "${FINAL_TAG}" \
            --title "${FINAL_TAG}" \
            --notes-file CHANGELOG_RELEASE.md
