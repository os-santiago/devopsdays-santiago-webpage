name: Manual Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm that you want to execute release"
        required: true
        type: boolean
        default: false
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - minor
          - major
        default: minor

permissions:
  contents: write

concurrency:
  group: manual-release-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.compute.outputs.rc_tag }}
      rc_commit: ${{ steps.compute.outputs.rc_commit }}
      final_tag: ${{ steps.compute.outputs.final_tag }}
      release_type: ${{ steps.compute.outputs.release_type }}
      last_stable_tag: ${{ steps.compute.outputs.last_stable_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch and confirmation
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "This workflow can only run from main. Current branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [[ "${{ github.event.inputs.confirm_release }}" != "true" ]]; then
            echo "Release confirmation was not provided. Set confirm_release=true."
            exit 1
          fi

      - name: Compute release version
        id: compute
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_rc_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*' | sort -V | tail -n 1 || true)"
          latest_stable_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          release_type="${{ github.event.inputs.release_type }}"

          if [[ -z "${latest_rc_tag}" ]]; then
            echo "No active RC tag found. Expected something like vX.Y.Z-rc.N"
            exit 1
          fi

          if [[ ! "${latest_rc_tag}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            echo "Invalid RC tag format: ${latest_rc_tag}"
            exit 1
          fi

          if [[ "${release_type}" != "minor" && "${release_type}" != "major" ]]; then
            echo "Unsupported release type: ${release_type}"
            exit 1
          fi

          # Policy: both minor and major promote the active RC base.
          final_tag="${BASH_REMATCH[1]}"
          rc_commit="$(git rev-list -n 1 "${latest_rc_tag}")"

          if git rev-parse -q --verify "refs/tags/${final_tag}" >/dev/null; then
            echo "Final tag already exists: ${final_tag}"
            exit 1
          fi

          echo "rc_tag=${latest_rc_tag}" >> "$GITHUB_OUTPUT"
          echo "rc_commit=${rc_commit}" >> "$GITHUB_OUTPUT"
          echo "final_tag=${final_tag}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "last_stable_tag=${latest_stable_tag}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs:
      - preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.rc_commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with release version
        env:
          VITE_APP_VERSION: ${{ needs.preflight.outputs.final_tag }}
        run: npm run build --production

      - name: Verify build output (including dotfiles)
        run: |
          set -euo pipefail
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload deployment scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-scripts
          path: scripts/ci/ftps_deploy.sh
          if-no-files-found: error

  approve-and-deploy:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    environment: prod
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Download deployment scripts artifact
        uses: actions/download-artifact@v4
        with:
          name: release-scripts
          path: scripts/ci

      - name: Install lftp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validate FTP config
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/ftps_deploy.log"
          : > "${log_file}"

          if [[ -z "${CPANEL_FTP_HOST:-}" || -z "${CPANEL_FTP_USER:-}" || -z "${CPANEL_FTP_PASSWORD:-}" ]]; then
            echo "Missing required FTPS secrets (CPANEL_FTP_HOST/CPANEL_FTP_USER/CPANEL_FTP_PASSWORD)." | tee -a "${log_file}"
            exit 1
          fi

          port="${CPANEL_FTP_PORT:-21}"
          remote_dir="${CPANEL_FTP_REMOTE_DIR:-devopsdayschile.cl/}"
          echo "Using FTPS host=${CPANEL_FTP_HOST} user=${CPANEL_FTP_USER} port=${port} remote_dir=${remote_dir}" | tee -a "${log_file}"

      - name: Connectivity/Auth preflight (FTPS)
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          CPANEL_FTP_INSECURE: ${{ secrets.CPANEL_FTP_INSECURE }}
        run: |
          bash scripts/ci/ftps_deploy.sh preflight

      - name: Purge remote directory (FTPS)
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          CPANEL_FTP_INSECURE: ${{ secrets.CPANEL_FTP_INSECURE }}
        run: |
          bash scripts/ci/ftps_deploy.sh purge

      - name: Upload dist (FTPS)
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          CPANEL_FTP_INSECURE: ${{ secrets.CPANEL_FTP_INSECURE }}
        run: |
          bash scripts/ci/ftps_deploy.sh upload

      - name: Upload FTPS diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ftps-diagnostics
          path: |
            ${{ runner.temp }}/ftps_deploy.log
          if-no-files-found: ignore

  smoke-test:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - approve-and-deploy
    steps:
      - name: Validate deployed version
        env:
          EXPECTED_TAG: ${{ needs.preflight.outputs.final_tag }}
        run: |
          set -euo pipefail

          expected_meta="<meta name=\"app-version\" content=\"${EXPECTED_TAG}\">"
          attempt=1
          max_attempts=12

          while [[ ${attempt} -le ${max_attempts} ]]; do
            html="$(curl -fsSL https://santiago.devopsdayschile.cl/ || true)"
            if grep -Fq "${expected_meta}" <<< "${html}"; then
              echo "Smoke test passed with expected version ${EXPECTED_TAG}"
              exit 0
            fi

            echo "Attempt ${attempt}/${max_attempts}: expected version not visible yet"
            attempt=$((attempt + 1))
            sleep 10
          done

          echo "Smoke test failed: expected deployed version ${EXPECTED_TAG}"
          exit 1

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.rc_commit }}
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          FINAL_TAG: ${{ needs.preflight.outputs.final_tag }}
          RC_COMMIT: ${{ needs.preflight.outputs.rc_commit }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${FINAL_TAG}" >/dev/null; then
            echo "Tag already exists: ${FINAL_TAG}"
            exit 1
          fi

          git tag -a "${FINAL_TAG}" -m "Release ${FINAL_TAG}" "${RC_COMMIT}"
          git push origin "refs/tags/${FINAL_TAG}"

      - name: Generate changelog
        id: changelog
        env:
          LAST_STABLE_TAG: ${{ needs.preflight.outputs.last_stable_tag }}
          RC_COMMIT: ${{ needs.preflight.outputs.rc_commit }}
        run: |
          set -euo pipefail

          if [[ -n "${LAST_STABLE_TAG}" ]]; then
            git log --pretty=format:'- %h %s' "${LAST_STABLE_TAG}..${RC_COMMIT}" > CHANGELOG_RELEASE.md
          else
            git log --pretty=format:'- %h %s' "${RC_COMMIT}" > CHANGELOG_RELEASE.md
          fi

          if [[ ! -s CHANGELOG_RELEASE.md ]]; then
            echo "- No commits found in selected range." > CHANGELOG_RELEASE.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_TAG: ${{ needs.preflight.outputs.final_tag }}
        run: |
          set -euo pipefail
          gh release create "${FINAL_TAG}" \
            --title "${FINAL_TAG}" \
            --notes-file CHANGELOG_RELEASE.md

      - name: Clean up RC tags for promoted candidate
        env:
          RC_TAG: ${{ needs.preflight.outputs.rc_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ ! "${RC_TAG}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            echo "RC tag does not match expected format, skipping cleanup: ${RC_TAG}"
            exit 0
          fi

          rc_base="${BASH_REMATCH[1]}"
          mapfile -t rc_tags < <(git tag -l "${rc_base}-rc.*" | sort -V)

          if [[ "${#rc_tags[@]}" -eq 0 ]]; then
            echo "No RC tags found to clean for ${rc_base}"
            exit 0
          fi

          echo "Deleting RC tags for ${rc_base}: ${rc_tags[*]}"

          for tag in "${rc_tags[@]}"; do
            git tag -d "${tag}" >/dev/null 2>&1 || true
            git push origin ":refs/tags/${tag}"
          done
