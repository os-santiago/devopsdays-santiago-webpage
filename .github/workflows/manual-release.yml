name: Manual Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm that you want to execute release"
        required: true
        type: boolean
        default: false
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - minor
          - major
        default: minor

permissions:
  contents: write

concurrency:
  group: manual-release-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.compute.outputs.rc_tag }}
      rc_commit: ${{ steps.compute.outputs.rc_commit }}
      final_tag: ${{ steps.compute.outputs.final_tag }}
      release_type: ${{ steps.compute.outputs.release_type }}
      last_stable_tag: ${{ steps.compute.outputs.last_stable_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch and confirmation
        env:
          CONFIRM_RELEASE: ${{ github.event.inputs.confirm_release }}
        run: bash scripts/ci/manual_release_validate_trigger.sh

      - name: Compute release version
        id: compute
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: bash scripts/ci/manual_release_compute_version.sh

  build:
    runs-on: ubuntu-latest
    needs:
      - preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.rc_commit }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with release version
        env:
          VITE_APP_VERSION: ${{ needs.preflight.outputs.final_tag }}
        run: npm run build --production

      - name: Verify build output (including dotfiles)
        run: |
          set -euo pipefail
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload deployment scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-scripts
          path: |
            scripts/ci/ftps_deploy.sh
            scripts/ci/manual_release_*.sh
          if-no-files-found: error

  approve-and-deploy:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    environment: prod
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Download deployment scripts artifact
        uses: actions/download-artifact@v4
        with:
          name: release-scripts
          path: scripts/ci

      - name: Install lftp
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validate FTP config
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
        run: bash scripts/ci/manual_release_validate_ftp_config.sh

      - name: Create SMTP runtime config for contact API
        env:
          SMTP_USER_PASSWORD: ${{ secrets.SMTP_USER_PASSWORD }}
        run: bash scripts/ci/manual_release_create_smtp_config.sh

      - name: Connectivity/Auth preflight (FTPS)
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          CPANEL_FTP_INSECURE: ${{ secrets.CPANEL_FTP_INSECURE }}
        run: |
          bash scripts/ci/ftps_deploy.sh preflight

      - name: Purge remote directory (FTPS)
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          CPANEL_FTP_INSECURE: ${{ secrets.CPANEL_FTP_INSECURE }}
        run: |
          bash scripts/ci/ftps_deploy.sh purge

      - name: Upload dist (FTPS)
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          CPANEL_FTP_INSECURE: ${{ secrets.CPANEL_FTP_INSECURE }}
        run: |
          bash scripts/ci/ftps_deploy.sh upload

      - name: Upload FTPS diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ftps-diagnostics
          path: |
            ${{ runner.temp }}/ftps_deploy.log
          if-no-files-found: ignore

  smoke-test:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - approve-and-deploy
    steps:
      - name: Download deployment scripts artifact
        uses: actions/download-artifact@v4
        with:
          name: release-scripts
          path: scripts/ci

      - name: Validate deployed version
        env:
          EXPECTED_TAG: ${{ needs.preflight.outputs.final_tag }}
        run: bash scripts/ci/manual_release_smoke_test.sh

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.rc_commit }}
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          FINAL_TAG: ${{ needs.preflight.outputs.final_tag }}
          RC_COMMIT: ${{ needs.preflight.outputs.rc_commit }}
        run: bash scripts/ci/manual_release_create_tag.sh

      - name: Generate changelog
        id: changelog
        env:
          LAST_STABLE_TAG: ${{ needs.preflight.outputs.last_stable_tag }}
          RC_COMMIT: ${{ needs.preflight.outputs.rc_commit }}
        run: bash scripts/ci/manual_release_generate_changelog.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_TAG: ${{ needs.preflight.outputs.final_tag }}
        run: |
          set -euo pipefail
          gh release create "${FINAL_TAG}" \
            --title "${FINAL_TAG}" \
            --notes-file CHANGELOG_RELEASE.md

      - name: Clean up RC tags for promoted candidate
        env:
          RC_TAG: ${{ needs.preflight.outputs.rc_tag }}
        run: bash scripts/ci/manual_release_cleanup_rc_tags.sh
